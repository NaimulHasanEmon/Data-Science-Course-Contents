<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinja2</title>
</head>
<body>
    <!-- Receiving parameters and showing them -->
    <p>Hey I am {{name}} and I am using Jinja2 in {{lang}}</p>

    {% for item in lucky %}
        <p>{{item}}</p>
    {% endfor %}

    <!-- Use | safe for showing passed html tag. This is safety feature. -->
    {{footer | safe}}
</body>
</html>
